<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>Call the agents</title>
<style>
  :root { --bg: #f6f5f2; --fg: #1d1d1b; --muted: #6b6a66; --card: #ffffff; --line: #e2e0da;
          --call: #2e7d4f; --hang: #b3322b;
          /* the laptop tray's colours: plain while only the wake word gets in, then green, red, yellow */
          --waiting: #8e8c86; --listening: #3cb371; --recording: #e24a4a; --transcribing: #e0a100; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141413; --fg: #ecebe6; --muted: #9a9892; --card: #1f1f1d; --line: #2d2d2a; --waiting: #6b6a66; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.45 system-ui, sans-serif;
         height: 100dvh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: .75rem; padding: .8rem 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 1.05rem; margin: 0; flex: 1; }
  #agent { font: inherit; font-size: .9rem; max-width: 45vw; padding: .45rem .5rem; border-radius: 10px;
           border: 1px solid var(--line); background: var(--card); color: var(--fg); }
  #call { border: 0; border-radius: 999px; padding: .55rem 1.1rem; font-size: 1rem; color: #fff; background: var(--call); }
  #call.on { background: var(--hang); }
  #chat { flex: 1; overflow-y: auto; padding: 1rem 16px; display: flex; flex-direction: column; gap: .5rem; }
  .msg { max-width: 85%; padding: .55rem .8rem; border-radius: 14px; background: var(--card); border: 1px solid var(--line);
         overflow-wrap: anywhere; }
  .msg .who { font-size: .75rem; color: var(--muted); margin-bottom: .1rem; }
  .msg.you { align-self: flex-end; background: color-mix(in srgb, var(--call) 18%, var(--card)); }
  .msg.note { align-self: center; background: none; border: 0; color: var(--muted); font-size: .85rem; }
  .msg[hidden] { display: none; }
  .msg.unsent { opacity: .55; text-decoration: line-through; }
  #talk-area { display: flex; flex-direction: column; align-items: center; gap: .4rem; padding: .8rem 16px .4rem; }
  #talk { width: 92px; height: 92px; border-radius: 50%; border: 0; background: var(--waiting); color: #fff;
          font-size: .9rem; font-weight: 600; touch-action: none; user-select: none; -webkit-user-select: none;
          box-shadow: 0 0 0 0 transparent; transition: background .15s, box-shadow .15s; }
  #talk[data-mode="listening"] { background: var(--listening); }
  #talk[data-mode="recording"] { background: var(--recording); box-shadow: 0 0 0 8px color-mix(in srgb, var(--recording) 30%, transparent); }
  #talk[data-mode="transcribing"] { background: var(--transcribing); }
  #talk:disabled { opacity: .45; }
  #state { color: var(--muted); font-size: .9rem; min-height: 1.3em; text-align: center; }
  #hint { color: var(--muted); font-size: .8rem; text-align: center; }
  form { display: flex; gap: .5rem; padding: .5rem 16px calc(.8rem + env(safe-area-inset-bottom)); }
  form input { flex: 1; min-width: 0; font: inherit; padding: .65rem .8rem; border-radius: 12px; border: 1px solid var(--line);
               background: var(--card); color: var(--fg); }
  form button { font: inherit; border: 0; border-radius: 12px; padding: 0 1rem; background: var(--call); color: #fff; }
</style>
</head>
<body>
<header>
  <h1>Call the agents</h1>
  <select id="agent" aria-label="Talking to" disabled><option>No agent yet</option></select>
  <button id="call">Call</button>
</header>
<div id="chat"><div class="msg note">Tap Call. Then just talk, hold the round button to talk, or type below.</div></div>
<div id="talk-area">
  <button id="talk" data-mode="waiting" disabled>Hold to talk</button>
  <div id="state">Not connected</div>
  <div id="hint">Hold to talk · tap to switch the open line off (noisy places) or on</div>
</div>
<form id="send"><input id="text" placeholder="Message the agent…" autocomplete="off" disabled><button>Send</button></form>
<script>
// Two small audio worklets: one sends the mic as 16 kHz 16-bit, one plays what the laptop sends (24 kHz 16-bit)
const worklets = `
class Mic extends AudioWorkletProcessor {
  // Down to 16 kHz by averaging each output sample's input span: picking single samples aliased
  // the high frequencies into the voice and Whisper misheard it (2026-11-15)
  constructor() { super(); this.step = sampleRate / 16000; this.acc = 0; this.n = 0; this.left = this.step; this.buf = []; }
  process([input]) {
    const ch = input[0]; if (!ch) return true;
    for (let i = 0; i < ch.length; i++) {
      this.acc += ch[i]; this.n++; this.left -= 1;
      if (this.left <= 0) {
        this.buf.push(Math.max(-1, Math.min(1, this.acc / this.n)) * 32767);
        this.acc = 0; this.n = 0; this.left += this.step;
      }
    }
    if (this.buf.length >= 320) {  // 20 ms at 16 kHz per message
      this.port.postMessage(Int16Array.from(this.buf).buffer); this.buf = [];
    }
    return true;
  }
}
class Speaker extends AudioWorkletProcessor {
  constructor() {
    super(); this.step = 24000 / sampleRate; this.queue = []; this.cur = null; this.pos = 0;
    // How much arrived, how much was dropped, how much was actually played out loud: the laptop
    // cannot hear the phone, so the page reports these (a clip that never reached the ear, 2026-11-15)
    this.got = 0; this.dropped = 0; this.loud = 0; this.frames = 0;
    this.port.onmessage = (e) => {
      this.queue.push(new Int16Array(e.data)); this.got++;
      if (this.queue.length > 50) { this.queue.splice(0, 25); this.dropped += 25; }  // over 1 s behind: drop half a second
    };
  }
  process(_, [output]) {
    const out = output[0];
    for (let i = 0; i < out.length; i++) {
      if (!this.cur || this.pos >= this.cur.length) { this.cur = this.queue.shift(); this.pos = 0; }
      out[i] = this.cur ? this.cur[Math.floor(this.pos)] / 32768 : 0;
      if (this.cur) this.pos += this.step;
      if (Math.abs(out[i]) > 0.01) this.loud++;
    }
    this.frames += out.length;
    if (this.frames >= sampleRate * 2) {  // every 2 s
      this.port.postMessage({got: this.got, dropped: this.dropped, loud_ms: Math.round(this.loud / sampleRate * 1000)});
      this.got = this.dropped = this.loud = this.frames = 0;
    }
    return true;
  }
}
registerProcessor('mic', Mic); registerProcessor('speaker', Speaker);`;

const $ = (id) => document.getElementById(id);
const callButton = $('call'), talk = $('talk'), state = $('state'), chat = $('chat'), text = $('text');
let buttonOnly = false;  // a noisy place: only holding the button gets in
let ws = null, ctx = null, stream = null, wakeLock = null;

// One chat per agent: each line carries its agent's session and only the current agent's are shown (the
// one replies go to, which follows whoever spoke last); notes about the call itself show in all of them
let current = '';
let typedCount = 0;  // ids for typed lines, so a "not sent" note marks the right one

function say(who, words, kind = '', session = '') {
  const div = document.createElement('div');
  div.className = `msg ${kind}`;
  div.dataset.session = session;
  div.hidden = Boolean(session && current && session !== current);
  if (who) { const w = document.createElement('div'); w.className = 'who'; w.textContent = who; div.append(w); }
  div.append(document.createTextNode(words));
  chat.append(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

// Who the call talks to: the agents heard lately and still running; picking one switches, as saying it would
const agentMenu = $('agent');
function showAgents(list, now) {
  if (now && now !== current) {
    current = now;
    for (const div of chat.querySelectorAll('.msg')) {
      div.hidden = Boolean(div.dataset.session && div.dataset.session !== current);
    }
    chat.scrollTop = chat.scrollHeight;
  }
  agentMenu.replaceChildren(...list.map((a) =>
    new Option(a.name, a.session, false, a.session === current)));
  if (!list.length) agentMenu.append(new Option('No agent yet'));
  agentMenu.disabled = !list.length || !ws;
}
agentMenu.onchange = () => send({switch: agentMenu.value});

function send(message) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(message)); }

async function start() {
  state.textContent = 'Starting…';
  stream = await navigator.mediaDevices.getUserMedia(
    {audio: {echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1}});
  ctx = new AudioContext();
  await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([worklets], {type: 'application/javascript'})));
  const mic = new AudioWorkletNode(ctx, 'mic'), speaker = new AudioWorkletNode(ctx, 'speaker');
  ctx.createMediaStreamSource(stream).connect(mic);
  speaker.connect(ctx.destination);
  // A context started after the mic prompt may begin suspended (no fresh tap): it would play nothing
  await ctx.resume();
  speaker.port.onmessage = (e) => send({stats: {...e.data, audio: ctx.state, hidden: document.hidden}});
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/call`);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => {
    callButton.textContent = 'Hang up'; callButton.classList.add('on');
    talk.disabled = text.disabled = false;
    if (buttonOnly) send({button_only: true});
    say('', 'Call started', 'note');
  };
  ws.onmessage = (e) => {
    if (typeof e.data !== 'string') { speaker.port.postMessage(e.data, [e.data]); return; }
    const status = JSON.parse(e.data);
    if (status.chat) {
      const c = status.chat;
      const div = say(c.from, c.text || '', c.from === 'you' ? 'you' : '', c.session || '');
      if (c.file) {  // an agent sent a file (`handsfree send`): a picture shown, audio playable, anything else a link
        const kind = (c.file.type || '').split('/')[0];
        const el = kind === 'image' ? Object.assign(document.createElement('img'), {style: 'max-width:100%;display:block'})
          : kind === 'audio' ? Object.assign(document.createElement('audio'), {controls: true})
          : kind === 'video' ? Object.assign(document.createElement('video'), {controls: true, style: 'max-width:100%'})
          : Object.assign(document.createElement('a'), {textContent: `📎 ${c.file.name}`, target: '_blank'});
        if (el.tagName === 'A') el.href = c.file.url; else el.src = c.file.url;
        const link = Object.assign(document.createElement('a'), {href: c.file.url, download: c.file.name,
                                                                  textContent: c.file.name, style: 'display:block'});
        div.append(el, ...(el.tagName === 'A' ? [] : [link]));
      }
      return;
    }
    if (status.agents) { showAgents(status.agents, status.current); return; }
    if (status.delivered !== undefined) return;  // the app's ticks: nothing for the page to show
    if (status.note) {
      // The typed line it refers to was put in the chat when sent: mark it, so it doesn't look delivered
      const line = status.unsent && chat.querySelector(`[data-id="${status.unsent}"]`);
      if (line) line.classList.add('unsent');
      say('', status.note, 'note');
      return;
    }
    state.textContent = status.state;
    talk.dataset.mode = status.mode || 'waiting';
  };
  ws.onclose = (e) => { stop(); say('', e.reason || 'Call ended', 'note'); };
  mic.port.onmessage = (e) => { if (ws.readyState === 1) ws.send(e.data); };
  try { wakeLock = await navigator.wakeLock.request('screen'); } catch (_) {}
}

function stop() {
  if (ws && ws.readyState <= 1) ws.close(1000, 'hung up');  // 1000: the laptop knows it's a hang-up, not a dropped line
  if (stream) stream.getTracks().forEach((t) => t.stop());
  if (ctx) ctx.close();
  if (wakeLock) wakeLock.release();
  ws = ctx = stream = wakeLock = null;
  callButton.textContent = 'Call'; callButton.classList.remove('on');
  talk.disabled = text.disabled = agentMenu.disabled = true; talk.dataset.mode = 'waiting'; state.textContent = 'Not connected';
}

// Back from another app or a locked screen: the browser may have suspended the audio
document.addEventListener('visibilitychange', () => { if (ctx && ctx.state !== 'running') ctx.resume(); });
callButton.onclick = () => (ws ? stop() : start().catch((err) => { stop(); say('', err.message, 'note'); }));

// One button. Hold it to talk: hands-free records while it is down and sends when it is let go.
// Tap it to switch the open line off (a noisy place: only holding gets in) or back on.
const HOLD_MS = 300;
let holdTimer = null, talking = false;
talk.addEventListener('pointerdown', (e) => {
  e.preventDefault(); talk.setPointerCapture(e.pointerId);
  holdTimer = setTimeout(() => { talking = true; send({push: true}); }, HOLD_MS);
});
const release = (e) => {
  e.preventDefault(); clearTimeout(holdTimer);
  if (talking) { talking = false; send({push: false}); return; }
  if (e.type !== 'pointerup') return;
  buttonOnly = !buttonOnly;
  send({button_only: buttonOnly});
  say('', buttonOnly ? 'Open line off: hold the button to talk' : 'Open line on: just talk', 'note');
};
talk.addEventListener('pointerup', release);
talk.addEventListener('pointercancel', release);
talk.addEventListener('contextmenu', (e) => e.preventDefault());

$('send').onsubmit = (e) => {
  e.preventDefault();
  const words = text.value.trim();
  if (!words) return;
  const id = String(++typedCount);
  send({chat: words, session: current, id});
  say('you', words, 'you', current).dataset.id = id;
  text.value = '';
};
</script>
</body>
</html>
